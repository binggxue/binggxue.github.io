<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="薛冰的个人学习主页：学习笔记与每日黄历。" />
    <title>薛冰的个人主页</title>
    <link rel="icon" href="img/logo.ico" type="image/ico" />
    <link rel="icon" href="img/logo.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/home.css" />
    <script type="module" src="js/theme.js" defer></script>
    <script type="module" src="js/home.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到正文</a>
    <div class="app-shell" id="top">
      <header class="masthead">
        <div class="container masthead__inner">
          <span class="masthead__spacer" aria-hidden="true"></span>
          <a class="masthead__wordmark" href="#top">薛冰的个人主页</a>
          <div class="masthead__tools">
            <a class="masthead__link" href="#notes">学习笔记</a>
            <button
              class="theme-toggle"
              id="themeToggle"
              type="button"
              data-mode="system"
              title="跟随系统"
              aria-label="切换浅色/暗黑模式（当前为跟随系统）"
            ></button>
          </div>
        </div>
      </header>

      <main id="main">
        <section class="hero" aria-labelledby="profileName">
          <div class="container hero__grid">
            <div class="hero__copy">
              <h1 id="profileName">Bing</h1>
              <p class="lead" id="profileIntro">这里记录学习笔记，以及每天正在积累的知识。</p>
              <a class="btn btn--primary" href="#notes">浏览学习笔记</a>
            </div>
            <figure class="hero__portrait">
              <img src="img/profile-photo.webp" alt="薛冰的头像" width="178" height="178" />
              <figcaption class="hero__caption">
                <span id="noteCount">--</span> 篇学习笔记
              </figcaption>
            </figure>
          </div>
        </section>

        <section class="almanac" id="almacCard" aria-labelledby="almanacTitle" hidden>
          <div class="container almanac__grid">
            <div class="almanac__head">
              <h2 id="almanacTitle">今日</h2>
              <p class="almanac__date" id="almacDateLabel">每日黄历</p>
              <p class="almanac__festival" id="almacFestival" hidden></p>
            </div>
            <div class="almanac__body">
              <div class="almanac__nav">
                <button class="icon-btn" id="previousDayButton" type="button">上一天</button>
                <button class="icon-btn" id="nextDayButton" type="button">下一天</button>
              </div>
              <dl class="almanac__rows">
                <div class="almanac__row">
                  <dt>农历</dt>
                  <dd id="almacLunar"></dd>
                </div>
                <div class="almanac__row">
                  <dt class="almanac__yi">宜</dt>
                  <dd id="almacYi"></dd>
                </div>
                <div class="almanac__row">
                  <dt>忌</dt>
                  <dd id="almacJi"></dd>
                </div>
              </dl>
            </div>
          </div>
        </section>

        <section class="quote" aria-label="今日摘句">
          <div class="container quote__grid">
            <blockquote class="quote__text" id="hitokoto">加载中…</blockquote>
            <p class="quote__source" id="hitokotoSource"></p>
          </div>
        </section>

        <section class="notes" id="notes" aria-labelledby="notesTitle">
          <div class="container">
            <header class="notes__head">
              <h2 id="notesTitle">学习笔记</h2>
              <p class="notes__meta">
                <strong><span id="noteCountLabel">--</span> 篇</strong>
                <span>PDF 资料</span>
              </p>
            </header>
            <div class="notes__list" id="notesList">
              <div class="home-empty">正在读取学习笔记…</div>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="container footer__inner">
          <p class="footer__wordmark">薛冰的个人主页</p>
          <div class="footer__row">
            <span>© 2026 薛冰</span>
            <span id="homeUpdated">最近一次更新：--</span>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
